<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fooocus-sud</title>
<link rel="stylesheet" href="static/app.css">
<script>
  // тема до отрисовки, чтобы не мигало: та же настройка, что у классического интерфейса
  try {
    let t = localStorage.getItem('sud2-theme') || localStorage.getItem('sud-theme');
    if (!['light', 'dark', 'paper'].includes(t)) t = matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
    document.documentElement.dataset.theme = t;
  } catch (e) {}
</script>
</head>
<body>
<div class="app">
  <header class="top">
    <span class="logo">Fooocus-sud</span>
    <span class="dim">новый интерфейс · этап 1</span>
    <span class="sp"></span>
    <span class="st" id="st-conn"><span class="dot"></span><span>подключаюсь…</span></span>
    <span class="st" id="st-queue"></span>
    <span class="st sys" id="st-sys"></span>
    <button class="st save" id="st-save" title="Автосохранение на ноут (та же папка, что в классическом интерфейсе)">💾 …</button>
    <span class="themes"><button class="ic" id="btn-theme" title="Тема"></button><div class="tmenu" id="tmenu" hidden></div></span>
  </header>
  <div class="main">
    <nav class="nav">
      <button class="nv on" data-view="create" title="Создать"></button>
      <button class="nv" data-view="gallery" title="Галерея"></button>
      <button class="nv" data-view="models" title="Модели: чекпоинты и LoRA"></button>
      <button class="nv" data-view="poses" title="Банк поз"></button>
      <button class="nv" data-view="settings" title="Настройки"></button>
      <a class="nv" href="/" title="Классический интерфейс (Inpaint, Enhance, позы, менеджер)" data-icon="classic"></a>
    </nav>
    <section class="center" id="v-create">
      <div class="view" id="viewer">
        <div class="empty" id="viewer-empty">Здесь появится картинка.<br><small>Ctrl+Enter — создать</small></div>
        <img id="viewer-img" alt="">
        <div class="tools" id="viewer-tools">
          <button class="tb" data-action="upscale_tiled" title="Апскейл 2x плитками: детальнее, цвета как у исходника (~2.5 мин на T4)">2× Tiled</button>
          <button class="tb" data-action="upscale" title="Обычный апскейл Fooocus 2x">2×</button>
          <button class="tb" data-action="upscale_15" title="Апскейл Fooocus 1.5x — быстрее и легче, чем 2x">1.5×</button>
          <button class="tb" data-action="vary_subtle" title="Лёгкая вариация: то же, чуть по-другому">≈ вариация</button>
          <button class="tb" data-action="vary_strong" title="Сильная вариация">≋ сильнее</button>
          <button class="tb" data-action="faces" title="Enhance: найти лица и перерисовать каждое отдельно">☺ лица</button>
          <button class="tb" data-act="inpaint" title="Перерисовать часть картинки (маска кистью) или дорисовать края">✎ Inpaint</button>
          <button class="tb" data-act="to-ip" title="Положить эту картинку в «Образцы» (Image Prompt)">⤒ в образцы</button>
          <button class="tb" data-act="reuse-seed" title="Вернуть seed этой картинки">seed</button>
          <a class="tb" id="dl" download title="Скачать">⬇</a>
        </div>
        <div class="inp-bar" id="inp-bar">
          <button class="tb on" data-inp-tool="brush" title="Кисть (B)">🖌 кисть</button>
          <button class="tb" data-inp-tool="erase" title="Ластик (E)">⌫ ластик</button>
          <label class="inp-size" title="Размер кисти (Alt+колёсико, [ и ])">размер <input type="range" id="inp-size" min="4" max="400" step="2"><output id="inp-size-o"></output></label>
          <button class="tb" data-inp="undo" title="Отменить (Ctrl+Z)">↶</button>
          <button class="tb" data-inp="invert" title="Инвертировать: перерисовать всё, кроме закрашенного">⇄ инвертировать</button>
          <button class="tb" data-inp="clear" title="Стереть всю маску">🗑 очистить</button>
          <span class="sp"></span>
          <button class="tb" data-inp="exit" title="Выйти (Esc)">✕ выйти</button>
        </div>
        <div class="inp-stage" id="inp-stage"><canvas id="inp-canvas"></canvas><div class="inp-cur" id="inp-cur"></div>
          <button class="inp-ar" data-out="Left" title="Дорисовать слева">←</button><button class="inp-ar" data-out="Right" title="Дорисовать справа">→</button>
          <button class="inp-ar" data-out="Top" title="Дорисовать сверху">↑</button><button class="inp-ar" data-out="Bottom" title="Дорисовать снизу">↓</button></div>
        <div class="progress" id="progress"><div class="bar"><b id="progress-bar"></b></div><span id="progress-text"></span></div>
      </div>
      <div class="strip" id="strip"></div>
      <div class="prompt">
        <div class="em" id="em" hidden></div>
        <div class="ip" id="ip" hidden></div>
        <div class="inp" id="inp" hidden></div>
        <textarea id="prompt" rows="3" placeholder="Что нарисовать? Можно по-русски — кнопка RU→EN или автоперевод"></textarea>
        <div class="neg" id="neg-row" hidden><textarea id="negative" rows="2" placeholder="Чего не должно быть (негативный промпт)"></textarea></div>
        <div class="prow">
          <span class="trg"><button class="chip" id="chip-tr" title="Перевести промпт и негатив на английский (DeepL / Google)">RU→EN</button><button class="chip" id="chip-tr-auto" title="Автоперевод: перед «Создать» русский текст сам переводится на английский">авто</button></span>
          <button class="chip" id="chip-tr-undo" hidden title="Вернуть русский текст, как было до перевода">↶ рус</button>
          <button class="chip" id="chip-em" title="Эмбеддинги: клик — в промпт, Shift+клик — туда, где курсор">🧬 эмбеддинги</button>
          <button class="chip" id="chip-ip" title="Образцы (Image Prompt): лицо, поза, контур, похожий стиль с фото">🖼 образцы</button>
          <button class="chip" id="chip-neg">− негатив</button>
          <button class="chip" id="chip-cam" title="Карточка «Камера» справа"></button>
          <button class="chip" id="chip-strip" title="Показать / спрятать ленту истории — больше места под картинку"></button>
          <span class="sp"></span>
          <button class="stop" id="btn-stop" hidden>Стоп</button>
          <button class="gen" id="btn-gen">Создать <small id="gen-sub"></small></button>
        </div>
      </div>
    </section>
    <section class="center" id="v-gallery" hidden>
      <div class="gallery" id="gallery"></div>
    </section>
    <section class="center" id="v-models" hidden>
      <div class="mm" id="mm"></div>
    </section>
    <section class="center" id="v-poses" hidden>
      <div class="pbank" id="pbank"></div>
    </section>
    <section class="center" id="v-settings" hidden>
      <div class="sett" id="sett"></div>
    </section>
    <div class="resizer" id="resizer" title="Потяни — ширина панели (двойной клик — по умолчанию)"></div>
    <aside class="right" id="right"></aside>
  </div>
</div>
<div class="lb" id="lb" hidden>
  <img id="lb-img" alt="" draggable="false">
  <div class="lb-bar">
    <span id="lb-info"></span><span class="sp"></span>
    <span id="lb-zoom">100%</span>
    <button class="lb-b" data-lb="fit" title="Вписать (двойной клик)">⤢</button>
    <button class="lb-b" data-lb="one" title="1:1 — пиксель в пиксель">1:1</button>
    <a class="lb-b" id="lb-dl" download title="Скачать">⬇</a>
    <button class="lb-b" data-lb="close" title="Закрыть (Esc)">✕</button>
  </div>
  <button class="lb-nav prev" data-lb="prev" title="Предыдущая (←)">‹</button>
  <button class="lb-nav next" data-lb="next" title="Следующая (→)">›</button>
</div>
<div class="pose" id="pose" hidden></div>
<script src="static/app.js"></script>
</body>
</html>
